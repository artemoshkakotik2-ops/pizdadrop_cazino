<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PZDC Tap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background: radial-gradient(circle at center, #1b1b3a 0%, #080811 100%);
            margin: 0;
            min-height: 100vh; 
            display: flex;
            flex-direction: column; 
            justify-content: center; 
            align-items: center;   
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            overflow: hidden;
            touch-action: manipulation; /* Отключает зум по двойному тапу */
        }

        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        .balance-title {
            font-size: 14px;
            color: #8f8fbf;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 5px 0;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(180deg, #ffffff 0%, #a5a5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .button-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .button-wrapper::before {
            content: '';
            position: absolute;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: #5d5dff;
            filter: blur(40px);
            opacity: 0.5;
            z-index: 0;
        }

        .tap_button {
            position: relative;
            z-index: 1;
            width: 220px;
            height: 220px;
            border-radius: 50%; 
            border: 8px solid #6b6bff;      
            cursor: pointer;    
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            background: linear-gradient(145deg, #4545ff, #2a2a99);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.6),
                inset 0 5px 15px rgba(255, 255, 255, 0.4),
                inset 0 -5px 15px rgba(0, 0, 0, 0.6);
            transition: transform 0.05s ease;
            outline: none;
        }

        .tap_button:active {
            transform: scale(0.93);
        }
    </style>
</head>
<body>

    <div class="balance-card">
        <p class="balance-title">Ваш Баланс</p>
        <h1 class="balance-amount"><span id="coins">0</span> PZDC</h1>
    </div>

    <div class="button-wrapper">
        <button class="tap_button" id="tapBtn">TAP!</button>
    </div>
    
    <div style="margin-top: 30px;">
        <button id="saveBtn" style="padding: 12px 24px; border-radius: 12px; border: none; background: #2ecc71; color: white; font-weight: bold; font-size: 16px; cursor: pointer;">
            📥 Задепать PZDC в бота
        </button>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); 

    const coinsText = document.getElementById('coins');
    const tapButton = document.getElementById('tapBtn');
    const saveBtn = document.getElementById('saveBtn');
    let balance = 0;

    function handleTap(e) {
        if (e) e.preventDefault();
        balance += 1;
        coinsText.innerText = balance;
        
        if (tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('light');
        }
    }

    // Поддержка и тачскринов, и кликов мышкой с ПК
    tapButton.addEventListener('touchstart', handleTap, { passive: false });
    tapButton.addEventListener('click', (e) => {
        // Если событие пришло от тача, не дублируем клик
        if (e.detail !== 0) handleTap();
    });

    saveBtn.addEventListener('click', () => {
        if (balance > 0) {
            tg.sendData(balance.toString());
            tg.close();
        } else {
            alert("Сначала натапай коины!");
        }
    });
</script>
</body>
</html>
